packages:
  - apps/*
  - packages/*

allowBuilds:
  bufferutil: true
  esbuild: true
  sharp: true
  utf-8-validate: true
  workerd: true

minimumReleaseAgeExclude:
  - '@nqbt/core@0.1.3'
  - nqbt@0.1.3
  - '@breadfs/aliyundrive@0.1.14'
  - '@breadfs/core@0.1.14'
  - '@breadfs/mem@0.1.14'
  - '@breadfs/node@0.1.14'
  - '@breadfs/webdav@0.1.14'
  - breadfs@0.1.14

ignoreWorkspaceRootCheck: true
shamefullyHoist: true
strictPeerDependencies: false
